<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Warranty sticker validation</title>
    <!-- مكتبة الكاميرا -->
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        /* التنسيقات الأصلية للصفحة */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; text-align: center; background-color: #f4f4f9; color: #333; line-height: 1.6; padding-bottom: 80px; }
        .container { max-width: 100%; margin: 0 auto; padding: 15px; background-color: #fff; }
        .header-content { text-align: left; margin-bottom: 30px; }
        .logo { width: 100px; margin-bottom: 10px; }
        .breadcrumb { font-size: 0.9rem; color: #777; margin: 10px 0 15px 0; }
        .breadcrumb a { color: #000 !important; text-decoration: none; }
        h2 { color: #2c3e50; font-size: 1.5rem; font-weight: 700; margin: 20px 0 40px 0; letter-spacing: 1px; }
        .main-description { font-size: 1rem; margin: 20px auto 30px auto; }
        .banner { width: 100%; max-height: 200px; object-fit: cover; margin: 40px 0; }
        .input-instruction { font-size: 0.9rem; margin: 15px 0; }

        /* --- تنسيق المربع والأزرار (مربع -> كاميرا -> تشك) --- */
        .input-container {
            width: 90%;
            max-width: 400px;
            display: flex;
            align-items: center;
            border: 2px solid #cccccc;
            border-radius: 25px 0 0 25px; /* انحناء أصلي من اليسار */
            overflow: hidden;
            margin: 10px auto;
            height: 45px;
            background: white;
        }

        .input-container input {
            flex: 1;
            padding: 0 15px;
            border: none;
            outline: none;
            height: 100%;
            font-size: 1rem;
            text-align: left;
        }

        .cam-btn {
            background-color: #a8822b;
            border: none;
            height: 100%;
            padding: 0 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            border-left: 1px solid rgba(255,255,255,0.3);
        }

        .check-btn {
            background-color: #a8822b;
            color: white;
            border: none;
            height: 100%;
            padding: 0 20px;
            cursor: pointer;
            font-weight: bold;
            border-radius: 0 !important; /* حاد الزوايا تماماً */
            font-size: 0.95rem;
            border-left: 1px solid rgba(255,255,255,0.3);
        }

        #camera-ui {
            display: none;
            width: 90%;
            max-width: 320px;
            margin: 15px auto;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 12px;
            background: #fff;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        #reader { width: 100%; border-radius: 8px; overflow: hidden; margin-top: 10px; }
        #result { margin: 20px auto; min-height: 50px; font-weight: bold; display: flex; align-items: center; justify-content: center; }
        .success { color: #28a745; }
        .error { color: #ff0000; }

        /* بقية التنسيقات الأصلية */
        .links { display: flex; justify-content: space-between; margin-top: 20px; text-align: left; padding-left: 40px; }
        .links-section { flex: 1; margin-left: 15px; }
        .bottom-buttons { display: flex; justify-content: space-around; padding: 10px; background: white; border-top: 1px solid #ddd; position: fixed; bottom: 0; width: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header-content">
            <img src="https://i.postimg.cc/zvf2c47L/image.png" class="logo">
            <div class="breadcrumb"><a href="#">Home</a> / <a href="#">Check sticker</a></div>
        </div>

        <h2>Warranty sticker validation</h2>
        <p class="main-description">تأكد إذا كان ملصق الضمان أصلي أو مزيف</p>
        <img src="https://i.ibb.co/3m3r1TWK/Warranty-sticker-26.jpg" class="banner">
        <p class="input-instruction">أدخل الرقم الموجود على الملصق هنا</p>

        <!-- الترتيب المطلوب: مربع -> كاميرا -> تشك -->
        <div class="input-container">
            <input type="text" id="numberInput" placeholder="XXXXXX">
            <button class="cam-btn" onclick="toggleCamera()" title="فتح الكاميرا">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="white"><path d="M4 4h3V2H2v5h2V4zm14-2v2h3v3h2V2h-5zM2 22h5v-2H4v-3H2v5zm20-5v3h-3v2h5v-5h-2zM7 7h10v10H7V7zm2 2v6h6V9H9z"/></svg>
            </button>
            <button class="check-btn" id="chkBtn" onclick="validateForm()">Check</button>
        </div>

        <div id="camera-ui">
            <select id="cam-select" style="width:100%; padding:8px; margin-bottom:10px;"></select>
            <button onclick="startScanning()" style="width:100%; padding:10px; background:#a8822b; color:white; border:none; border-radius:5px; cursor:pointer;">ابدأ المسح</button>
            <div id="reader"></div>
            <button id="stop-btn" onclick="stopScanning()" style="display:none; width:100%; margin-top:10px; padding:10px; background:red; color:white; border:none; border-radius:5px; cursor:pointer;">إيقاف</button>
        </div>

        <div id="result"></div>
    </div>

    <script>
        let scanner;
        function toggleCamera() {
            const ui = document.getElementById('camera-ui');
            ui.style.display = ui.style.display === 'block' ? 'none' : 'block';
            if (ui.style.display === 'block') {
                Html5Qrcode.getCameras().then(devices => {
                    const select = document.getElementById('cam-select');
                    select.innerHTML = '';
                    devices.forEach(d => {
                        const opt = document.createElement('option');
                        opt.value = d.id; opt.text = d.label || 'Camera';
                        select.appendChild(opt);
                    });
                });
            }
        }

        function startScanning() {
            const cid = document.getElementById('cam-select').value;
            if (!cid) return alert("اختر كاميرا");
            document.getElementById('stop-btn').style.display = 'block';
            scanner = new Html5Qrcode("reader");
            scanner.start(cid, { fps: 10, qrbox: 250 }, (text) => {
                document.getElementById('numberInput').value = text;
                stopScanning();
                validateForm();
            });
        }

        function stopScanning() {
            if (scanner) {
                scanner.stop().then(() => {
                    document.getElementById('camera-ui').style.display = 'none';
                    document.getElementById('stop-btn').style.display = 'none';
                });
            }
        }

        function validateForm() {
            const val = document.getElementById('numberInput').value.trim();
            const res = document.getElementById('result');
            if (!val) return;
            res.innerHTML = "جاري التحقق...";
            setTimeout(() => {
                res.innerHTML = "<span class='error'>الرمز غير موجود ❌</span>";
            }, 600);
        }
    </script>
</body>
</html>
